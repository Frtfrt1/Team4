<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Coveranks — 통합 데모</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="bg-animation" id="bg-triangles"></div>

  <header id="site-header">
    <div class="brand" id="home-logo">
      <div class="mark"></div>
      <div class="brand-title">Coveranks</div>
    </div>
    <nav class="nav">
      <div class="nav-link" id="nav-submit">노래 신청</div>
    </nav>
  </header>

  <div class="top-search">
    <div class="search-inner">
      <input id="global-search" type="search" placeholder="어떤 곡의 커버를 찾으시나요?" />
    </div>
  </div>

  <main id="app">
    <section id="page-home" class="page">
      <div class="site-hero" id="site-hero">
        <div class="hero-inner">
          <div class="hero-title" id="type-title"></div>
          <div class="hero-lead" id="type-lead"></div>
        </div>
      </div>
      <div id="covers-container" class="list"></div>
    </section>

    <section id="page-submit" class="page hidden">
      <div class="panel">
        <h2 style="margin-bottom:24px">새로운 노래 / 커버 신청</h2>
        <div class="field">
          <label class="field-label">원곡 제목 *</label>
          <input id="input-song-title-submit" type="text" placeholder="예: Lemon" />
        </div>
        <div class="field">
          <label class="field-label">원곡 아티스트 *</label>
          <input id="input-song-artist-submit" type="text" placeholder="예: 요네즈 켄시" />
        </div>
        <div class="field">
          <label class="field-label">커버 아티스트 *</label>
          <input id="input-cover-artist-submit" type="text" placeholder="예: A-Soul" />
        </div>
        <div style="display:flex; gap:12px; margin-top:20px;">
          <button id="btn-submit-cover" class="text-btn">신청 등록하기</button>
          <button id="btn-back-home" style="background:none; color:var(--muted); border:none; cursor:pointer;">돌아가기</button>
        </div>
      </div>
    </section>
  </main>

  <footer>© Coveranks — Discover Your Best Covers</footer>

  <script src="js/script.js"></script>
</body>
</html>
